name: Sync GitHub issues

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-issue-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync production data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Request production sync
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$SYNC_TOKEN" ]; then
            echo "SYNC_TOKEN is not configured as a repository secret."
            exit 1
          fi

          response="$(
            curl --silent --show-error --fail-with-body \
              --connect-timeout 30 \
              --max-time 1500 \
              --request POST \
              --header "Accept: application/json" \
              --header "Authorization: Bearer $SYNC_TOKEN" \
              https://contribute-on-rails.fly.dev/api/syncs
          )"

          printf '%s\n' "$response"

          SYNC_RESPONSE="$response" python3 <<'PYTHON'
          import json
          import os

          payload = json.loads(os.environ["SYNC_RESPONSE"])
          if payload.get("status") != "succeeded":
              raise SystemExit(f"Synchronization did not succeed: {payload}")
          PYTHON
