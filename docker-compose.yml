services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contribute_on_rails
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contribute_on_rails"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      PGHOST: db
      CONTRIBUTE_ON_RAILS_DATABASE_PASSWORD: postgrespassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
