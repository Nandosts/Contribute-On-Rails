# fly.toml app configuration file generated for contribute-on-rails on 2026-07-15T09:56:35-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'contribute-on-rails'
primary_region = 'gru'
console_command = '/rails/bin/rails console'

[build]
[deploy]
  release_command = './bin/rails db:prepare'

[env]
  HTTP_PORT = '8080'
  SOLID_QUEUE_IN_PUMA = 'true'

[processes]
  app = './bin/thrust ./bin/rails server'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  cpu_kind = "shared"
  memory_mb = 256
swap_size_mb = 512
